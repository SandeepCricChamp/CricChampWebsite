<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in CricChamp</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: #043d69;
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>
  <script>
    function openApp() {
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get('id');
      const packageName = 'com.ffghub.cricchamp';
      const schemeUrl = `cricchamp://event?id=${eventId}`;
      const fallbackUrl = `market://details?id=${packageName}`;
      window.location.href = schemeUrl;
      setTimeout(() => {
        window.location.href = fallbackUrl;
      }, 2000);
    }
    window.onload = openApp;
  </script>
</head>
<body>
  <p>Opening CricChamp...</p>
</body>
</html>
