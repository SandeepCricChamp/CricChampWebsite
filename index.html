<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CricChamp - 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="hero">
    <section class="hero-copy">
      <h1 class="brand">CRICCHAMP <span class="brand-dot">-</span> <span class="brand-3d">3D</span></h1>

      <h2 class="tagline">
        <span class="tagline-top">Welcome to</span>
        <span class="tagline-bottom">CASUAL CRICKET</span>
      </h2>

      <div class="download-row" aria-label="Download CricChamp">
        <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.ffghub.cricchamp" aria-label="Get it on Google Play">
          <img src="google-play-badge.png" alt="Google Play" />
        </a>

        <span class="arrow" aria-hidden="true">←</span>

        <a class="app-badge" href="#" aria-label="Download app">
          <img src="app-icon.png" alt="CricChamp app icon" />
        </a>

        <span class="arrow" aria-hidden="true">→</span>

        <a class="store-badge app-store" href="#" aria-label="Download on App Store">
          <span class="apple"></span>
        </a>
      </div>

      <div class="download-caption">DOWNLOAD</div>
    </section>

    <section class="hero-visual" aria-label="CricChamp visual placeholder"></section>
  </main>
</body>
</html>
