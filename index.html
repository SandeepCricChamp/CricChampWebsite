<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricChamp - 3D Casual Cricket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <section class="hero-copy">
      <h1 class="brand">CRIC<span>CHAMP</span> <b>-</b> <strong>3D</strong></h1>
      <h2 class="tagline"><span>Welcome to</span><br>CASUAL CRICKET</h2>

      <div class="download-area">
        <a class="store-badge google-play" href="https://play.google.com/store/apps/details?id=com.ffghub.cricchamp" aria-label="Get CricChamp on Google Play">
          <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
        </a>

        <span class="download-arrow" aria-hidden="true">←</span>

        <a class="app-icon-link" href="#" aria-label="Download CricChamp">
          <span class="app-icon-placeholder" aria-hidden="true">🏆</span>
          <span class="download-label">DOWNLOAD</span>
        </a>

        <span class="download-arrow" aria-hidden="true">→</span>

        <a class="store-badge app-store" href="#" aria-label="Download on the App Store">
          <span class="apple-mark" aria-hidden="true">●</span>
          <span><small>Download on the</small><b>App Store</b></span>
        </a>
      </div>
    </section>

    <section class="hero-visual" aria-label="Image section reserved for a future image"></section>
  </main>
</body>
</html>
